name: Publish Standalone Formula Library

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish wheel and sdist to PyPI'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish kb-formulas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install build tool dependencies
        run: uv sync --all-extras

      - name: Build kb-formulas wheel and source distribution
        run: uv build packages/kb_formulas

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kb-formulas-dist
          path: packages/kb_formulas/dist/*

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/kb_formulas/dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_to_pypi == 'true')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/kb_formulas/dist/
          skip-existing: true
        continue-on-error: true
