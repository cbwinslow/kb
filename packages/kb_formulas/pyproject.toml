[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-formulas"
version = "0.1.0"
description = "Standalone scientific formula library for sports analytics and sabermetrics compiled directly from peer-reviewed research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Knowledge Base Research Team" }]
keywords = ["sabermetrics", "baseball", "sports-analytics", "polars", "mathematics", "formulas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "polars>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/cbwinslow/kb"
Repository = "https://github.com/cbwinslow/kb.git"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_formulas"]
